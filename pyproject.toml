[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-pglocks"
version = "2.0.0"
description = "Context managers for PostgreSQL advisory locks in Django."
readme = "README.rst"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Christophe Pettus", email = "xof@thebuild.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "django>=4.2",
    "psycopg2-binary>=2.9.11",
]

[project.urls]
Homepage = "https://github.com/Xof/django-pglocks"
Repository = "https://github.com/Xof/django-pglocks"

[tool.hatch.build.targets.wheel]
packages = ["src/django_pglocks"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["django_pglocks"]
mypy_path = "src"

[tool.ruff]
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "django-stubs>=5.0",
]
