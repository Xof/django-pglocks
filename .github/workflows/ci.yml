# CI for django-pglocks, a frozen deprecation shim (consolidated into django-pgware).
# The package ships no tests of its own — it only re-exports from django-pgware — so
# CI is intentionally limited to lint (ruff + mypy) and a build smoke check. There is
# no PostgreSQL/Django test matrix because there is nothing here to exercise.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv build
      - run: ls -la dist/
