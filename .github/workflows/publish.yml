# Publishes to PyPI via trusted publishing (OIDC) on a published GitHub Release.
# There is deliberately no TestPyPI step: the django-pglocks name on TestPyPI is
# held by an unrelated account, so trusted publishing there is impossible. Pre-release
# validation is done locally instead (uv build + twine check).
name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Verify package contents
        run: |
          echo "=== Wheel contents ==="
          unzip -l dist/*.whl
          echo ""
          echo "=== Sdist contents ==="
          tar tzf dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
